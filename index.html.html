<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-Connector V2 — Product Finder</title>
  <style>
    body { font-family: sans-serif; padding: 40px 20px; background: #fff; color: #222; }
    #qc-b2b { max-width: 900px; margin: 0 auto; }
    .qc-logo { text-align:center; margin-bottom:24px; }
    .qc-logo img { height:200px; width:auto; object-fit:contain; }
    h2 { font-size: 1.3em; margin-bottom: 16px; text-align:center; }
    .qc-row { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
    .qc-col { flex:1; min-width:180px; }
    .qc-col label { display:block; margin-bottom:4px; font-weight:bold; font-size:0.85em; text-transform:uppercase; letter-spacing:0.05em; }
    .qc-col select { width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; font-size:0.95em; }
    button { background:#222; color:#fff; padding:10px 24px; border:none; border-radius:4px; cursor:pointer; font-size:1em; width:100%; margin-top:4px; }
    #qc-b2b-result { display:none; margin-top:20px; }
    .qc-card { display:flex; align-items:center; gap:16px; padding:14px; border:1px solid #ddd; border-radius:6px; margin-bottom:12px; background:#fafafa; }
    .qc-card img { width:80px; height:80px; object-fit:contain; border-radius:4px; background:#fff; border:1px solid #eee; }
    .qc-card-info { flex:1; }
    .qc-card-name { font-weight:600; font-size:0.95rem; color:#222; margin-bottom:4px; }
    .qc-card-sku { font-size:0.85rem; color:#666; }
    .qc-card-qty { font-size:0.85rem; color:#e00; margin-top:4px; }
    .qc-card-shopkit { border-color:#bbb; background:#f0f0f0; }
  </style>
</head>
<body>
<div id="qc-b2b">

  <div class="qc-logo">
    <img src="https://cdn.shopify.com/s/files/1/0082/9734/9205/files/ZENO_Logo.jpg?v=1656649091" alt="Zenocycle">
  </div>

  <h2>🔧 Q-Connector V2 — Product Finder</h2>

  <div class="qc-row">
    <div class="qc-col">
      <label>I am a...</label>
      <select id="qcb-role" onchange="qcbUpdate()">
        <option value="">-- Select --</option>
        <option value="consumer">General Consumer</option>
        <option value="shop">Shop User</option>
        <option value="distributor">Distributor / Wholesaler</option>
        <option value="oem">OEM / Brand</option>
      </select>
    </div>
    <div class="qc-col">
      <label>Bike Type</label>
      <select id="qcb-bike" onchange="qcbUpdate()">
        <option value="">-- Select --</option>
        <option value="road">Road Bike / Gravel Bike</option>
        <option value="mtb">Mountain Bike (MTB)</option>
        <option value="touring">Touring</option>
      </select>
    </div>
    <div class="qc-col">
      <label>Routing Type</label>
      <select id="qcb-routing" onchange="qcbUpdate()">
        <option value="">-- Select --</option>
        <option value="full">Full Internal</option>
        <option value="semi">Semi-Internal</option>
        <option value="external">External Routing</option>
      </select>
    </div>
  </div>

  <div class="qc-row">
    <div class="qc-col">
      <label>Fluid Type</label>
      <select id="qcb-fluid" onchange="qcbUpdate()">
        <option value="">-- Select --</option>
        <option value="mineral">Mineral Oil</option>
        <option value="dot">DOT 4/5</option>
      </select>
    </div>
    <div class="qc-col">
      <label>Brake Model / Spec</label>
      <select id="qcb-spec">
        <option value="">-- Select --</option>
      </select>
    </div>
    <div class="qc-col">
      <label>Number of Sets</label>
      <select id="qcb-qty">
        <option value="">-- Select --</option>
        <option value="1">1 Set (Single brake)</option>
        <option value="2">2 Sets (Front + Rear)</option>
      </select>
    </div>
  </div>

  <div class="qc-row">
    <div class="qc-col" style="display:flex;align-items:flex-end;">
      <button onclick="qcbRecommend()">Find Products</button>
    </div>
  </div>

  <div id="qc-b2b-result">
    <p style="font-weight:bold; margin-bottom:12px;">✅ Recommended Products:</p>
    <div id="qc-b2b-result-text"></div>
  </div>
</div>

<script>

    skus: { default: 'SLQ2-SC1' },
    base: '/products/q-connector-v2-shop-set',
    variants: {}
  },

const qcbData = {
  road_full_mineral_bh90_1: [['pin','bh90','1'],['socket','bh90','1']],
  road_full_mineral_bh90_2: [['pin','bh90','2'],['socket','bh90','2']],
  road_full_mineral_bh59_1: [['pin','bh59','1'],['socket','bh59','1']],
  road_full_mineral_bh59_2: [['pin','bh59','2'],['socket','bh59','2']],
  road_full_dot_sram_1:     [['pin','sram','1'],['socket','sram','1']],
  road_full_dot_sram_2:     [['pin','sram','2'],['socket','sram','2']],

  road_full_dot_hope_2:     [['pin','hope','2'],['socket','hope','2']],

  road_semi_mineral_bh90_2: [['m9',null,'2']],
  road_semi_mineral_bh59_1: [['m8','shimano','1']],
  road_semi_mineral_bh59_2: [['m8','shimano','2']],
  road_semi_dot_sram_1:     [['m8','sram','1']],

  road_external_mineral_bh90_2: [['pin_diy','bh90','2'],['socket_diy','bh90','2']],
  road_external_mineral_bh59_1: [['pin_diy','bh59','1'],['socket_diy','bh59','1']],
  road_external_mineral_bh59_2: [['pin_diy','bh59','2'],['socket_diy','bh59','2']],
  road_external_mineral_campy_1: [['pin_diy','bh59','1'],['socket_diy','bh59','1']],
  road_external_mineral_campy_2: [['pin_diy','bh59','2'],['socket_diy','bh59','2']],
  road_external_dot_sram_1:     [['pin_diy','sram','1'],['socket_diy','sram','1']],
  road_external_dot_sram_2:     [['pin_diy','sram','2'],['socket_diy','sram','2']],
  road_external_dot_hope_1:     [['pin_diy','hope','1'],['socket_diy','hope','1']],
  road_external_dot_hope_2:     [['pin_diy','hope','2'],['socket_diy','hope','2']],
  mtb_full_mineral_bh90_1: [['pin','bh90','1'],['socket','bh90','1']],
  mtb_full_mineral_bh90_2: [['pin','bh90','2'],['socket','bh90','2']],
  mtb_full_mineral_bh59_1: [['pin','bh59','1'],['socket','bh59','1']],
  mtb_full_mineral_bh59_2: [['pin','bh59','2'],['socket','bh59','2']],

  mtb_full_mineral_magura_2: [['pin','bh59','2'],['socket','bh59','2']],

  mtb_external_mineral_bh90_2: [['pin_diy','bh90','2'],['socket_diy','bh90','2']],
  mtb_external_mineral_bh59_1: [['pin_diy','bh59','1'],['socket_diy','bh59','1']],
  mtb_external_mineral_bh59_2: [['pin_diy','bh59','2'],['socket_diy','bh59','2']],
  mtb_external_dot_sram_1:     [['pin_diy','sram','1'],['socket_diy','sram','1']],
  mtb_external_dot_sram_2:     [['pin_diy','sram','2'],['socket_diy','sram','2']],
  mtb_external_dot_hope_1:     [['pin_diy','hope','1'],['socket_diy','hope','1']],
  mtb_external_dot_hope_2:     [['pin_diy','hope','2'],['socket_diy','hope','2']],
  touring_full_mineral_bh90_1: [['pin','bh90','1'],['socket','bh90','1']],
  touring_full_mineral_bh90_2: [['pin','bh90','2'],['socket','bh90','2']],

  touring_external_mineral_bh90_2: [['pin_diy','bh90','2'],['socket_diy','bh90','2']],
  touring_external_dot_sram_1:     [['pin_diy','sram','1'],['socket_diy','sram','1']],

  touring_external_dot_hope_1:     [['pin_diy','hope','1'],['socket_diy','hope','1']],
  touring_external_dot_hope_2:     [['pin_diy','hope','2'],['socket_diy','hope','2']],

const qcbSpecOptions = {
  road_full_mineral:     [{value:'bh90',label:'BH-90'},{value:'bh59',label:'BH-59'}],
  road_full_dot:         [{value:'sram',label:'SRAM Standard'},{value:'hope',label:'Hope Tech Standard'}],
  road_semi_mineral:     [{value:'bh90',label:'BH-90'},{value:'bh59',label:'BH-59'}],
  road_semi_dot:         [{value:'sram',label:'SRAM AXS Brake Lever or Equivalent'}],
  road_external_mineral: [{value:'bh90',label:'BH-90'},{value:'bh59',label:'BH-59'},{value:'campy',label:'Campagnolo'}],
  road_external_dot:     [{value:'sram',label:'SRAM Standard'},{value:'hope',label:'Hope Tech Standard'}],
  mtb_full_mineral:      [{value:'bh90',label:'BH-90'},{value:'bh59',label:'BH-59'},{value:'magura',label:'Magura'}],
  mtb_full_dot:          [{value:'sram',label:'SRAM Standard'},{value:'hope',label:'Hope Tech Standard'},{value:'magura',label:'Magura'}],
  mtb_semi_mineral:      [{value:'bh90',label:'BH-90'},{value:'bh59',label:'BH-59'}],
  mtb_semi_dot:          [{value:'sram',label:'SRAM AXS Brake Lever or Equivalent'}],
  mtb_external_mineral:  [{value:'bh90',label:'BH-90'},{value:'bh59',label:'BH-59'}],
  mtb_external_dot:      [{value:'sram',label:'SRAM Standard'},{value:'hope',label:'Hope Tech Standard'}],
  touring_full_mineral:  [{value:'bh90',label:'BH-90'}],
  touring_full_dot:      [{value:'sram',label:'SRAM Standard'},{value:'hope',label:'Hope Tech Standard'}],
  touring_semi_dot:      [{value:'sram',label:'SRAM AXS Brake Lever or Equivalent'}],
  touring_external_mineral:[{value:'bh90',label:'BH-90'}],
  touring_external_dot:  [{value:'sram',label:'SRAM Standard'},{value:'hope',label:'Hope Tech Standard'}],
};

function qcbUpdate() {
  const bike = document.getElementById('qcb-bike').value;
  const routing = document.getElementById('qcb-routing').value;
  const fluid = document.getElementById('qcb-fluid').value;
  const specSelect = document.getElementById('qcb-spec');
  const key = [bike, routing, fluid].filter(Boolean).join('_');
  const opts = qcbSpecOptions[key];
  specSelect.innerHTML = '<option value="">-- Select --</option>';
  if (opts && bike && routing && fluid) {
    opts.forEach(o => { specSelect.innerHTML += `<option value="${o.value}">${o.label}</option>`; });
  }
  document.getElementById('qc-b2b-result').style.display = 'none';
}

function qcbRecommend() {
  const role = document.getElementById('qcb-role').value;
  const bike = document.getElementById('qcb-bike').value;
  const routing = document.getElementById('qcb-routing').value;
  const fluid = document.getElementById('qcb-fluid').value;
  const spec = document.getElementById('qcb-spec').value;
  const qty = document.getElementById('qcb-qty').value;
  if (!role || !bike || !routing || !fluid || !spec || !qty) {
    alert('Please complete all selections.');
    return;
  }
  const key = `${bike}_${routing}_${fluid}_${spec}_${qty}`;
  const result = qcbData[key];
  const resultDiv = document.getElementById('qc-b2b-result');
  const resultText = document.getElementById('qc-b2b-result-text');

  const isConsumer = role === 'consumer';
  const showShopKit = (role === 'shop' || role === 'distributor');

  if (result) {
    const hasPin = result.some(([pk]) => pk === 'pin');
    const hasSocket = result.some(([pk]) => pk === 'socket');
    let html = result.map(([productKey, variantKey, qtyNum]) => {
      const p = qcbProducts[productKey];
      const sku = variantKey ? (p.skus[variantKey] || p.skus.default || '-') : (p.skus.default || '-');
      if (isConsumer) {
        const url = variantKey && p.variants[variantKey]
          ? `${p.base}?variant=${p.variants[variantKey]}`
          : p.base;
        return `<div class="qc-card">
          <img src="${p.img}" alt="${p.name}">
          <div class="qc-card-info">
            <div class="qc-card-name">${p.name}</div>
            <div class="qc-card-qty">Quantity: ${qtyNum}</div>
            <div style="margin-top:6px;"><a href="https://zenocycleparts.com${url}" target="_blank" style="color:#333; font-weight:bold; text-decoration:underline;">Click Here</a></div>
          </div>
        </div>`;
      } else {
        return `<div class="qc-card">
          <img src="${p.img}" alt="${p.name}">
          <div class="qc-card-info">
            <div class="qc-card-name">${p.name}</div>
            <div class="qc-card-sku">SKU: <strong>${sku}</strong></div>
            <div class="qc-card-qty">Quantity: ${qtyNum}</div>
          </div>
        </div>`;
      }
    }).join('');

    if (showShopKit && hasPin && hasSocket) {
      const sk = qcbProducts['shopkit'];
      html += `<div class="qc-card qc-card-shopkit">
        <img src="${sk.img}" alt="${sk.name}">
        <div class="qc-card-info">
          <div class="qc-card-name">💡 Also available as a set: ${sk.name}</div>
          <div class="qc-card-sku">SKU: <strong>${sk.skus.default}</strong></div>
        </div>
      </div>`;
    }
    resultText.innerHTML = html;
  } else {
    resultText.innerHTML = '<p>No matching spec found. Please contact us for assistance.</p>';
  }
  resultDiv.style.display = 'block';
}
</script>
</body>
</html>
